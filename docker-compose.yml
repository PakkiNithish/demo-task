services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lawsutra-backend
    restart: always
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - PORT=8000
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    ports:
      - "8000:8000"
    shm_size: "1gb"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lawsutra-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
